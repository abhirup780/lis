services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lis
      POSTGRES_USER: lis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lis -d lis"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      LIS_DATABASE_URL: postgresql+psycopg://lis:${POSTGRES_PASSWORD:-lis}@db:5432/lis
      LIS_SECRET_KEY: ${LIS_SECRET_KEY:-change-this-secret-key-before-production-use}
      LIS_SEED_DEMO: ${LIS_SEED_DEMO:-true}
      LIS_CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
